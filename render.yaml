# Render Blueprint: weekday paper-learning alert cron (US Eastern / EDT = UTC-4).
# After apply / Manual Sync: fill secrets in the tqqq-sqqq-alerts env group and
# confirm paper risk keys: ALPACA_PAPER_EQUITY_PCT=0.15 (fraction, 15% of equity —
# NOT 15), PAPER_MAX_BUY_NOTIONAL=300 (USD hard cap), PAPER_MAX_DAILY_LOSS_USD=25,
# PAPER_MAX_WEEKLY_LOSS_USD=60, PAPER_TQQQ_ONLY=false.
# Requires POSITION_STATE_BACKEND=supabase and TRADE_LOG_BACKEND=supabase so position
# and the learning journal survive ephemeral disks.
#
# Paper learning: ALPACA_PAPER_TRADING=true + DRY_RUN=false submits to paper-api only.
# Live Alpaca trading host is blocked in config.py (never set ALPACA_TRADING_BASE_URL
# to https://api.alpaca.markets). EXECUTION_BROKER is unset here, so the cron stays
# on Alpaca paper. Do not set EXECUTION_BROKER=alpaca_live_shadow,
# EXECUTION_BROKER=alpaca_live_pilot, ALPACA_LIVE_ENABLED, LIVE_TRADING_ENABLED,
# ALPACA_LIVE_NEW_ENTRIES_ENABLED, or ALPACA_LIVE_* keys on this cron unless
# Hemman explicitly asks later. Merging pilot code must not auto-activate live.
# alpaca_live_shadow is read-only (NOT_SUBMITTED). alpaca_live_pilot requires
# multi-key arming and is not armed here. Bare alpaca_live is rejected.
# robinhood_shadow and robinhood_connected_shadow only log a would-be order and
# never submit. robinhood_live is rejected.
#
# Apply SQL migrations in Supabase before first cron:
#   dashboard/supabase/migrations/20260714180000_bot_position_state.sql
#   dashboard/supabase/migrations/20260930190000_bot_trade_log.sql
#
# Cadence: ONE cron service, every 15 minutes across a UTC window that covers
# both EDT (UTC-4) and EST (UTC-5). Schedule: */15 13-21 * * 1-5.
# That is 9:00–17:45 ET in summer and 8:00–16:45 ET in winter. The cron firing
# is not permission to trade. --market-hours-only calls cron_skip_reason()
# (America/New_York): weekend, NYSE holiday, pre-open, after close (including
# 13:00 ET early closes), and lunch blackout 12:00–12:59 ET.
# Full pytest runs in GitHub Actions, not in this cron build: a red test should
# fail the PR before Render, and compileall is the deploy syntax gate.
# One service stays under Render's 25-service workspace limit.
#
# Docs: README.md → "Deploy on Render"; store docs/cloud-setup-supabase-render.md

services:
  - type: cron
    name: tqqq-sqqq-alerts-daytime
    runtime: python
    plan: starter
    schedule: "*/15 13-21 * * 1-5"
    # Fail the build if any module is truncated/corrupt (Render previously went
    # live on a mid-restore main.py that raised SyntaxError at log_event()).
    buildCommand: python -m compileall -q . && pip install -r requirements.txt
    startCommand: python main.py --no-technical --market-hours-only
    envVars:
      - fromGroup: tqqq-sqqq-alerts

envVarGroups:
  - name: tqqq-sqqq-alerts
    envVars:
      - key: POSITION_STATE_BACKEND
        value: supabase
      - key: POSITION_STATE_BOT_ID
        value: default
      - key: TRADE_LOG_BACKEND
        value: supabase
      - key: TRADE_LOG_BOT_ID
        value: default
      # Paper learning latch (live host rejected in app config).
      - key: DRY_RUN
        value: "false"
      - key: ALPACA_PAPER_TRADING
        value: "true"
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: TRADE_LOG_JSONL
        value: logs/trades.jsonl
      # Paper risk box (Path B only). Still paper-api; never live Alpaca.
      # Buy size = paper equity × ALPACA_PAPER_EQUITY_PCT (fraction: 0.15 = 15%).
      # Do NOT paste 15 — that would mean 15× equity. Code rejects values > 1.
      # PAPER_MAX_BUY_NOTIONAL is a hard USD cap per buy (clamps equity-% and
      # ALPACA_PAPER_NOTIONAL fallback). ALPACA_PAPER_NOTIONAL stays the fallback
      # when equity fetch fails (config default 500, then clamped to this cap).
      # Kill keys are USD dollars, not percents. 0 / empty / false = that gate OFF.
      # Do not set PAPER_TQQQ_ONLY=true — one book trades both TQQQ and SQQQ.
      # Never set ALPACA_TRADING_BASE_URL to https://api.alpaca.markets.
      - key: ALPACA_PAPER_EQUITY_PCT
        value: "0.15"
      - key: PAPER_MAX_BUY_NOTIONAL
        value: "300"
      - key: PAPER_MAX_DAILY_LOSS_USD
        value: "25"
      - key: PAPER_MAX_WEEKLY_LOSS_USD
        value: "60"
      - key: PAPER_TQQQ_ONLY
        value: "false"
      # Secrets — set once in Dashboard env group (never commit).
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
