# Render Blueprint: weekday paper-learning alert cron (US Eastern / EDT = UTC-4).
# After apply / Manual Sync: fill secrets in the tqqq-sqqq-alerts env group and
# confirm paper risk keys (USD, gates ON): PAPER_MAX_BUY_NOTIONAL=300,
# PAPER_MAX_DAILY_LOSS_USD=25, PAPER_MAX_WEEKLY_LOSS_USD=60, PAPER_TQQQ_ONLY=false.
# Requires POSITION_STATE_BACKEND=supabase and TRADE_LOG_BACKEND=supabase so position
# and the learning journal survive ephemeral disks.
#
# Paper learning: ALPACA_PAPER_TRADING=true + DRY_RUN=false submits to paper-api only.
# Live Alpaca trading host is blocked in config.py (never set ALPACA_TRADING_BASE_URL
# to https://api.alpaca.markets). Robinhood is not wired here.
#
# Apply SQL migrations in Supabase before first cron:
#   dashboard/supabase/migrations/20260714180000_bot_position_state.sql
#   dashboard/supabase/migrations/20260930190000_bot_trade_log.sql
#
# Cadence: ONE cron service, every 15 minutes during the US equity day.
# Schedule (EDT = UTC-4): */15 13-19 * * 1-5 → 9:00–15:45 ET weekdays.
# --market-hours-only no-ops pre-open (9:00/9:15) and enforces lunch blackout
# 12:00–12:59 ET (16:00–16:59 UTC in EDT) via lunch_blackout_reason in market_hours.py.
# First useful slots include 9:30/9:45 through 11:45, then 13:00 through afternoon.
# One service stays under Render's 25-service workspace limit (was 12 half-hour crons).
#
# Winter (EST = UTC-5): shift the UTC hour range one hour later
# (e.g. */15 14-20 * * 1-5); lunch then falls at 17:00–17:59 UTC. Or leave the
# EDT expression and rely on --market-hours-only / lunch guard (America/New_York
# wall-clock) for occasional skip / edge-of-session runs near DST boundaries.
#
# Docs: README.md → "Deploy on Render"; store docs/cloud-setup-supabase-render.md

services:
  - type: cron
    name: tqqq-sqqq-alerts-daytime
    runtime: python
    plan: starter
    schedule: "*/15 13-19 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --no-technical --market-hours-only
    envVars:
      - fromGroup: tqqq-sqqq-alerts

envVarGroups:
  - name: tqqq-sqqq-alerts
    envVars:
      - key: POSITION_STATE_BACKEND
        value: supabase
      - key: POSITION_STATE_BOT_ID
        value: default
      - key: TRADE_LOG_BACKEND
        value: supabase
      - key: TRADE_LOG_BOT_ID
        value: default
      # Paper learning latch (live host rejected in app config).
      - key: DRY_RUN
        value: "false"
      - key: ALPACA_PAPER_TRADING
        value: "true"
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: TRADE_LOG_JSONL
        value: logs/trades.jsonl
      # Paper risk box (Path B only). Units are USD dollars, not percents.
      # 0 / empty / false = gate OFF in code. These defaults turn the gates ON.
      # Sized for a ~$1,000 paper sleeve: daily ~2.5%, weekly ~6%.
      # PAPER_MAX_BUY_NOTIONAL is a hard USD cap per buy (clamps ALPACA_PAPER_NOTIONAL).
      # Do not set PAPER_TQQQ_ONLY=true — one book trades both TQQQ and SQQQ.
      # Never set ALPACA_TRADING_BASE_URL to https://api.alpaca.markets.
      - key: PAPER_MAX_BUY_NOTIONAL
        value: "300"
      - key: PAPER_MAX_DAILY_LOSS_USD
        value: "25"
      - key: PAPER_MAX_WEEKLY_LOSS_USD
        value: "60"
      - key: PAPER_TQQQ_ONLY
        value: "false"
      # Secrets — set once in Dashboard env group (never commit).
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
