# Render Blueprint: weekday paper-learning alert crons (US Eastern / EDT = UTC-4).
# After apply: fill secret values for the tqqq-sqqq-alerts env group in the Dashboard.
# Requires POSITION_STATE_BACKEND=supabase and TRADE_LOG_BACKEND=supabase so position
# and the learning journal survive ephemeral disks.
#
# Paper learning: ALPACA_PAPER_TRADING=true + DRY_RUN=false submits to paper-api only.
# Live Alpaca trading host is blocked in config.py (never set ALPACA_TRADING_BASE_URL
# to https://api.alpaca.markets). Robinhood is not wired here.
#
# Apply SQL migrations in Supabase before first cron:
#   dashboard/supabase/migrations/20260714180000_bot_position_state.sql
#   dashboard/supabase/migrations/20260930190000_bot_trade_log.sql
#
# Winter (EST = UTC-5): shift each schedule one hour later, or rely on
# --market-hours-only and accept occasional skip near the edges.
#
# Docs: README.md → "Deploy on Render"; store docs/trade-learning-log.md

services:
  - type: cron
    name: tqqq-sqqq-alerts-1000
    runtime: python
    plan: starter
    schedule: "0 14 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --no-technical --market-hours-only
    envVars:
      - fromGroup: tqqq-sqqq-alerts

  - type: cron
    name: tqqq-sqqq-alerts-1230
    runtime: python
    plan: starter
    schedule: "30 16 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --no-technical --market-hours-only
    envVars:
      - fromGroup: tqqq-sqqq-alerts

  - type: cron
    name: tqqq-sqqq-alerts-1530
    runtime: python
    plan: starter
    schedule: "30 19 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --no-technical --market-hours-only
    envVars:
      - fromGroup: tqqq-sqqq-alerts

envVarGroups:
  - name: tqqq-sqqq-alerts
    envVars:
      - key: POSITION_STATE_BACKEND
        value: supabase
      - key: POSITION_STATE_BOT_ID
        value: default
      - key: TRADE_LOG_BACKEND
        value: supabase
      - key: TRADE_LOG_BOT_ID
        value: default
      # Paper learning latch (live host rejected in app config).
      - key: DRY_RUN
        value: "false"
      - key: ALPACA_PAPER_TRADING
        value: "true"
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: TRADE_LOG_JSONL
        value: logs/trades.jsonl
      # Secrets — set once in Dashboard env group (never commit).
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
